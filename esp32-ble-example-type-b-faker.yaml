<<: !include esp32-ble-example-type-b-debug.yaml

# Replays real frames of a TAB SmartBat 100Ah (4S LiFePO4, SmartBat-B22704)
# captured in https://github.com/syssi/esphome-ogt-bms/issues/86

ogt_bms_ble:
  - ble_client_id: client0
    id: bms0
    update_interval: 60s
    ble_name: SmartBat-B22704

interval:
  - interval: 30s
    then:
      # Temperature: +RD,08080B (8: 0x08, 9.25°C)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x28, 0x20, 0x28, 0x20, 0x28, 0x5A, 0x15, 0x12
          });

      - delay: 1s

      # Total Voltage: +RD,091034 (9: 0x09, 13.328V)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x28, 0x21, 0x29, 0x28, 0x2B, 0x2C, 0x15, 0x12
          });

      - delay: 1s

      # Current: +RD,0ABCFE01 (10: 0x0A, -0.324A)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x28, 0x59, 0x5A, 0x5B, 0x5E, 0x5D, 0x28, 0x29, 0x15, 0x12
          });

      - delay: 1s

      # State of Charge: +RD,0D64 (13: 0x0D, 100%)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x28, 0x5C, 0x2E, 0x2C, 0x15, 0x12
          });

      - delay: 1s

      # Capacity Remaining: +RD,0F3F280A (15: 0x0F, 103.03Ah)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x28, 0x5E, 0x2B, 0x5E, 0x2A, 0x20, 0x28, 0x59, 0x15, 0x12
          });

      - delay: 1s

      # Full Charge Capacity: +RD,1088280A (16: 0x10, 103.76Ah)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x29, 0x28, 0x20, 0x20, 0x2A, 0x20, 0x28, 0x59, 0x15, 0x12
          });

      - delay: 1s

      # Time to Empty: +RD,123246 (18: 0x12, 17970 min)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x29, 0x2A, 0x2B, 0x2A, 0x2C, 0x2E, 0x15, 0x12
          });

      - delay: 1s

      # Time to Full: +RD,13FFFF (19: 0x13, not available)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x29, 0x2B, 0x5E, 0x5E, 0x5E, 0x5E, 0x15, 0x12
          });

      - delay: 1s

      # Cycles: +RD,171400 (23: 0x17, 20 cycles)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x29, 0x2F, 0x29, 0x2C, 0x28, 0x28, 0x15, 0x12
          });

      - delay: 1s

      # Design Capacity: +RD,1810270A (24: 0x18, 100.0Ah)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x29, 0x20, 0x29, 0x28, 0x2A, 0x2F, 0x28, 0x59, 0x15, 0x12
          });

      - delay: 1s

      # Cell Voltage 01: +RD,3F010D (63: 0x3F, 3.329V)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x2B, 0x5E, 0x28, 0x29, 0x28, 0x5C, 0x15, 0x12
          });

      - delay: 1s

      # Cell Voltage 02: +RD,3E070D (62: 0x3E, 3.335V)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x2B, 0x5D, 0x28, 0x2F, 0x28, 0x5C, 0x15, 0x12
          });

      - delay: 1s

      # Cell Voltage 03: +RD,3D050D (61: 0x3D, 3.333V)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x2B, 0x5C, 0x28, 0x2D, 0x28, 0x5C, 0x15, 0x12
          });

      - delay: 1s

      # Cell Voltage 04: +RD,3C080D (60: 0x3C, 3.336V)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x2B, 0x5B, 0x28, 0x20, 0x28, 0x5C, 0x15, 0x12
          });

      - delay: 1s

      # Cell Voltage 05: +RD,3B0000 (59: 0x3B, no cell on a 4S pack)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x2B, 0x5A, 0x28, 0x28, 0x28, 0x28, 0x15, 0x12
          });

      - delay: 1s

      # Cell Voltage 06: +RD,3A0000 (58: 0x3A, no cell on a 4S pack)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x2B, 0x59, 0x28, 0x28, 0x28, 0x28, 0x15, 0x12
          });

      - delay: 1s

      # Cell Voltage 16: +RD,300000 (48: 0x30, no cell on a 4S pack)
      - lambda: |-
          id(bms0).on_ogt_bms_ble_data({
            0x33, 0x4A, 0x5C, 0x34, 0x2B, 0x28, 0x28, 0x28, 0x28, 0x28, 0x15, 0x12
          });
